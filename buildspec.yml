version: 0.2

env:
  variables:
    ECR_REPO_URI: "676278186770.dkr.ecr.us-west-2.amazonaws.com/jenkins-eks-demo"
    S3_STAGING_BUCKET: "jenkins-eks-demo-staging-676278186770"

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin $ECR_REPO_URI
      - echo "Downloading staged artifacts from S3..."
      - aws s3 cp s3://$S3_STAGING_BUCKET/$BUILD_ID/app.jar ./app.jar
      - aws s3 cp s3://$S3_STAGING_BUCKET/$BUILD_ID/Dockerfile ./Dockerfile
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG=$BUILD_ID; fi

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t $ECR_REPO_URI:$IMAGE_TAG -t $ECR_REPO_URI:latest .

  post_build:
    commands:
      - echo "Pushing image to ECR..."
      - docker push $ECR_REPO_URI:$IMAGE_TAG
      - docker push $ECR_REPO_URI:latest
      - echo "Done. Pushed $ECR_REPO_URI:$IMAGE_TAG"
      - printf '[{"name":"app","imageUri":"%s"}]' "$ECR_REPO_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
