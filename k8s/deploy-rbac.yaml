apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deploy
  namespace: staging
---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-role
  namespace: staging
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-rolebinding
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: jenkins-deploy
    namespace: staging
roleRef:
  kind: Role
  name: deploy-role
  apiGroup: rbac.authorization.k8s.io
