apiVersion: v1
kind: Namespace
metadata:
  name: staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: staging
  labels:
    app: app
    env: staging
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: app
      env: staging
  template:
    metadata:
      labels:
        app: app
        env: staging
    spec:
      # Karpenter Spot node targeting — matches the cost-optimized theme of the rest
      # of the pipeline. Remove/adjust if you'd rather this run on-demand.
      nodeSelector:
        karpenter.sh/capacity-type: spot
      tolerations:
        - key: "karpenter.sh/capacity-type"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"

      containers:
        - name: app
          # BUILD_NUMBER gets substituted by Jenkins at deploy time (step 3),
          # e.g. via `sed` or `envsubst` before kubectl apply. Never deploy `latest`.
          image: 676278186770.dkr.ecr.us-west-2.amazonaws.com/jenkins-eks-demo:${BUILD_NUMBER}
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          # Give the pod time to finish in-flight requests when Spot reclaims
          # the node or a rollout replaces it.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]

      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: staging
  labels:
    app: app
    env: staging
spec:
  type: ClusterIP
  selector:
    app: app
    env: staging
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-pdb
  namespace: staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: app
      env: staging
